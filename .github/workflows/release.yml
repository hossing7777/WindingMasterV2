name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Unit tests and release build
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Sign APK (only if keystore secrets exist)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out "WindingMaster-${GITHUB_REF_NAME}.apk" aligned.apk
          rm -f release.jks
      - name: Keep unsigned APK (no keystore secrets)
        if: env.KEYSTORE_BASE64 == ''
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk "WindingMaster-${GITHUB_REF_NAME}-unsigned.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: WindingMaster-*.apk
